[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "cvxpy>=1.4",
    "networkx>=3.0",
    "numpy>=1.24",
    "openfermion>=1.7,<2",
    "openfermionpyscf>=0.5,<0.6",
    "pyscf>=2.8,<3",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
