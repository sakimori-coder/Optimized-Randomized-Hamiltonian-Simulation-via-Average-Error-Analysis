[project]
name = "my-project"
version = "0.1.0"
description = "Pauli versus fermionic grouping with normalized HS weights for qDRIFT"
requires-python = ">=3.10.11"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pyscf>=2.8,<3",
    "qulacs>=0.6.14,<0.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "openfermion>=1.7,<2",
    "openfermionpyscf>=0.5,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
